language: php

php:
  - 8.2
  - 8.3
  - 8.4
  - 8.5

script:
  - bash .travis.phplint.sh

notifications:
  irc:
    channels:
      - "chat.freenode.net#huggle"
    on_success: change
    on_failure: always
    template:
      - "%{repository}/%{branch}/%{commit} - %{author} %{message} %{build_url}"
